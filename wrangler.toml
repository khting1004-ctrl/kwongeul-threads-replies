name = "kwongeul-threads-replies"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["*/5 * * * *"]

# D1 database binding must be configured in Cloudflare dashboard as DB.
# Before deployment, add the D1 binding in Worker Settings > Bindings:
# Variable name: DB
# Database: kwongeul-threads-db
# Never commit API tokens or admin passwords.
