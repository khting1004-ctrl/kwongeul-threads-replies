name = "kwongeul-threads-replies"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "kwongeul-threads-db"
database_id = "a2a1df39-83b2-46d7-97de-c51d69fffd72"
